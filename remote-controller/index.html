<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Remote Controller</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="brand">
        <span class="dot" id="statusDot"></span>
        <span class="title">Remote Controller</span>
      </div>
      <span class="status" id="statusText">Connecting…</span>
    </header>

    <div id="insecureNotice" class="notice hidden" role="alert">
      The microphone needs a secure context (HTTPS or localhost). 
      Your connection is not secure, so the talk button cannot record audio.
    </div>

    <nav class="persona-strip" id="personaStrip" aria-label="Persona">
      <!-- Personas loaded dynamically -->
    </nav>

    <div class="transcript" id="transcript" aria-live="polite">
      <p class="empty" id="emptyState">Hold the button, speak, release. The avatar will answer.</p>
    </div>

    <p class="mic-error hidden" id="micError"></p>

    <footer class="footer">
      <div class="lang-pills" role="radiogroup" aria-label="Language">
        <button type="button" role="radio" aria-checked="true" class="lang-pill active" data-lang="auto">Auto</button>
        <button type="button" role="radio" aria-checked="false" class="lang-pill" data-lang="en">EN</button>
        <button type="button" role="radio" aria-checked="false" class="lang-pill" data-lang="hi">हि</button>
        <button type="button" role="radio" aria-checked="false" class="lang-pill" data-lang="te">తె</button>
      </div>

      <button type="button" class="talk-button" id="talkButton" aria-label="Hold to speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3Z" />
          <path d="M19 11a7 7 0 0 1-14 0" />
          <path d="M12 18v3" />
        </svg>
        <span class="talk-label" id="talkLabel">Connect to start</span>
      </button>
    </footer>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
